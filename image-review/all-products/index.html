<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>勇吉屋 全商品画像 加工確認</title>
  <link rel="stylesheet" href="assets/review.css">
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">勇吉屋・全商品画像加工</p>
      <h1><span class="phrase">原本と加工後を、</span><span class="phrase">一画面で確認</span></h1>
      <p class="lead">商品そのものは変えず、背景・光・傾き・構図だけを整えます。忠実度90点未満はBASEへ反映しません。</p>
      <div id="stats" class="stats" aria-live="polite"></div>
    </div>
  </header>

  <main class="main">
    <section class="controls" aria-label="画像の絞り込み">
      <label>
        <span>商品検索</span>
        <input id="query" type="search" placeholder="商品名・商品ID" autocomplete="off">
      </label>
      <label>
        <span>状態</span>
        <select id="status">
          <option value="all">すべて</option>
          <option value="queued">加工待ち</option>
          <option value="review_pending">確認待ち</option>
          <option value="regenerate">再生成</option>
          <option value="approved">承認済み</option>
          <option value="uploaded_verified">BASE反映済み</option>
        </select>
      </label>
      <button id="export" class="secondary" type="button">この端末の判定を保存</button>
    </section>

    <p id="result-summary" class="result-summary" aria-live="polite"></p>
    <section id="grid" class="grid" aria-label="画像比較一覧"></section>
    <nav class="pager" aria-label="ページ切り替え">
      <button id="prev" type="button">前へ</button>
      <span id="page"></span>
      <button id="next" type="button">次へ</button>
    </nav>
    <noscript>この確認画面を表示するにはJavaScriptを有効にしてください。</noscript>
  </main>

  <dialog id="zoom">
    <button id="zoom-close" class="zoom-close" type="button" aria-label="拡大画像を閉じる">閉じる</button>
    <img id="zoom-image" alt="">
    <p id="zoom-caption"></p>
  </dialog>

  <script src="assets/review.js" defer></script>
</body>
</html>
